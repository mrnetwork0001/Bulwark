# Bulwark resilience gate (FEATURES #14).
# On every PR that touches targets/**: run the test suite (including each
# target's chaos regression specs), run an offline chaos scorecard for every
# changed target (simulated brain, no API keys), compare it with the committed
# targets/<t>/resilience-baseline.json, post/update one sticky PR comment, and
# fail the check if any target got less resilient.
#
# Optional secret: NEATLOGS_API_KEY (traces are exported to neatlogs when set).
# LLM keys are not used: the scorecard runs the simulated brain.

name: Bulwark chaos check

on:
  pull_request:
    paths:
      - 'targets/**'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to score: comma-separated names, or "all"'
        required: false
        default: 'all'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bulwark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: Chaos scorecard vs baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
      BULWARK_NEATLOGS_WAIT_MS: '0'
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests (unit + chaos regression specs for every target)
        run: npm test

      - name: Chaos scorecard vs committed baseline
        id: scorecard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGETS: ${{ inputs.targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -n "$BASE_SHA" ]; then
            npm run ci:scorecard -- --changed-from "$BASE_SHA" --run-url "$RUN_URL"
          else
            npm run ci:scorecard -- --target "${TARGETS:-all}" --run-url "$RUN_URL"
          fi
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bulwark-scorecard
          path: .bulwark/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Post or update the sticky PR comment
        # Fork PRs get a read-only token; the job summary still has the scorecard.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('.bulwark/ci/scorecard.md') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.bulwark/ci/scorecard.md', 'utf8');
            const marker = '<!-- bulwark-ci-scorecard -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if resilience dropped below the baseline
        if: steps.scorecard.outputs.exit != '0'
        env:
          CODE: ${{ steps.scorecard.outputs.exit }}
        run: |
          echo "::error::Bulwark: resilience dropped below the committed baseline (ci:scorecard exit $CODE). See the PR comment or the bulwark-scorecard artifact."
          exit 1
