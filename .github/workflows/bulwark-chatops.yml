# Bulwark ChatOps (FEATURES #15): `/bulwark …` commands in PR comments.
#
#   /bulwark help
#   /bulwark attack [target] [fault|all]
#   /bulwark fix [target] [pr]
#   /bulwark replay [target] <fault> <seed>
#
# Only repository owners, members and collaborators can trigger it (checked here
# and again in bulwark/chatops-cli.ts). The comment text reaches the runner only
# as an environment variable; bulwark/chatops.ts validates every argument against
# the target allowlist and fault catalog and runs npm with an argv array, so no
# shell ever sees the comment. `fix … pr` pushes only a new bulwark/fix-* branch
# and opens a PR into this PR's branch: never this PR's branch, never main.

name: Bulwark ChatOps

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bulwark-chatops-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  chatops:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/bulwark') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # only for `/bulwark fix … pr`, which pushes a new bulwark/fix-* branch
      pull-requests: write
    env:
      NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
      BULWARK_NEATLOGS_WAIT_MS: '0'
    steps:
      - name: Acknowledge and look up the PR
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: 'eyes' });
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('is_fork', String(pr.head.repo?.full_name !== `${owner}/${repo}`));

      - name: Check out the PR's code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Git identity for fix branches
        run: |
          git config user.name "bulwark[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the command
        env:
          BULWARK_COMMENT_BODY: ${{ github.event.comment.body }}
          BULWARK_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          BULWARK_PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BULWARK_PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BULWARK_PR_IS_FORK: ${{ steps.pr.outputs.is_fork }}
          BULWARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: npm run chatops -- --out .bulwark/chatops/reply.md

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bulwark-chatops-${{ github.run_id }}
          path: |
            .bulwark/chatops/
            .bulwark/runs/*/*.md
            .bulwark/runs/*/*.patch
            .bulwark/runs/*/*.json
            .bulwark/runs/*/*.svg
            runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Reply on the PR
        if: always() && hashFiles('.bulwark/chatops/reply.md') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.bulwark/chatops/reply.md', 'utf8');
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
